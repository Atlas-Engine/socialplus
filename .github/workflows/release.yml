name: Publish release

# Cuts a release from CHANGELOG.md whenever a new version section lands on main.
#
# Why it is NOT triggered by pushing a tag: CurseForge builds its file the
# moment a tag appears and generates its own changelog from the git log. A
# workflow reacting to that same tag publishes the Release seconds later --
# always too late, and CurseForge never re-reads it. Creating the tag and the
# Release together via `gh release create` closes that window, so the tag
# CurseForge sees already has proper notes attached.
#
# Nothing here talks to CurseForge; its existing GitHub integration does the
# rest, so no API key or secret is involved.
on:
  # Manual re-run, for redoing a release after its tag has been deleted.
  # The path filter below only applies to push, so this needs no changelog edit.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - name: Work out whether there is a new version to release
        id: check
        run: |
          set -euo pipefail

          # Topmost "## <version>" heading is the version being released.
          VERSION="$(grep -m1 '^## ' CHANGELOG.md | sed -e 's/^## //' -e 's/[[:space:]]*$//')"
          if [ -z "${VERSION}" ]; then
            echo "No '## <version>' heading found in CHANGELOG.md" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Already released: this push changed the changelog for some other
          # reason (a typo fix, an older entry). Nothing to do -- and skipping
          # rather than failing keeps such edits from showing as red builds.
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists -- nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.check.outputs.release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.check.outputs.version }}"

          # This version's section only: everything after its heading, up to
          # the next "## ".
          awk -v want="## ${VERSION}" '
            $0 == want { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > section.md

          if [ ! -s section.md ]; then
            echo "No '## ${VERSION}' section found in CHANGELOG.md" >&2
            exit 1
          fi

          # Plain text, deliberately NOT Markdown. CurseForge shows these notes
          # unrendered: a "[text](url)" link displays as literal syntax and a
          # "---" rule as three dashes. A bare URL auto-links on both CurseForge
          # and GitHub, so this reads correctly in both places.
          {
            sed -e '/./,$!d' section.md
            printf '\nView all changelogs: https://github.com/%s/blob/main/CHANGELOG.md\n' "${GITHUB_REPOSITORY}"
          } > notes.md

          echo "--- release notes ---"
          cat notes.md

      - name: Commit the single-version changelog CurseForge will use
        id: notescommit
        if: steps.check.outputs.release == 'true'
        run: |
          set -euo pipefail
          # CurseForge does NOT read the GitHub Release body -- it generates its
          # own changelog from the commits between tags. .pkgmeta manual-changelog
          # overrides that, but it points at a FILE in the repo, so the file has
          # to exist at the tagged commit. Writing just this version keeps
          # CurseForge showing the release entries, not history or commit noise.
          cp notes.md CHANGELOG-RELEASE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG-RELEASE.md
          if git diff --cached --quiet; then
            echo "CHANGELOG-RELEASE.md already current."
          else
            # Only this file: touching CHANGELOG.md would re-trigger the workflow.
            git commit -m "Update release changelog for ${{ steps.check.outputs.version }}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag and release together
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.check.outputs.version }}"

          # --target creates the tag at this commit as part of publishing, so a
          # tag never exists on its own. That ordering is the entire point.
          # Tag the changelog commit, not the pushed one: the tagged commit must
          # contain CHANGELOG-RELEASE.md or CurseForge builds without it.
          TARGET="${{ steps.notescommit.outputs.sha }}"
          if [ -z "${TARGET}" ]; then TARGET="${GITHUB_SHA}"; fi
          gh release create "${VERSION}" \
            --target "${TARGET}" \
            --title "${VERSION}" \
            --notes-file notes.md
